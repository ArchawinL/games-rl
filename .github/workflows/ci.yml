name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kuhn-nfsp .

      - name: Tests
        run: docker run --rm -v "$PWD:/app" kuhn-nfsp pytest -q

      - name: Smoke train (does not converge; just checks the pipeline)
        run: docker run --rm -v "$PWD:/app" kuhn-nfsp python -m kuhn_nfsp.train --config configs/kuhn_nfsp_smoke.yaml
